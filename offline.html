<!doctype html>
<html lang="en">
<head>

  a { display: inline-block; background: #60a5fa; color: #0f172a; font-weight: 700;
      padding: .75rem 2rem; border-radius: .75rem; text-decoration: none; font-size: .9rem; }

<body>
  <div class="card">
    <div class="icon">📡</div>
